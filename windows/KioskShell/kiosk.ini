# KioskShell 설정 — exe와 같은 폴더에 두면 읽는다 (없으면 기본값)
# 명령행 1번째 인자로 URL을 주면 이 파일보다 우선한다.

# WebView가 띄울 Nuxt 페이지
Url=http://192.168.0.10:5090

# F12 개발자도구 / F5 새로고침 허용 (운영 시 false)
DevTools=false

# 항상 위 (운영 시 true)
TopMost=true

# --- 사이드카 (KioskAgent) — 지폐기 시리얼 + 원격 관리 ---

# 지폐기 COM 포트 (사이드카가 시리얼을 잡는다). 비우면 첫 번째 포트 자동 선택 (예: COM3)
SerialPort=

# 에이전트 수신 포트 (웹의 지폐기 API /bill/* 도 이 포트)
AgentPort=9100

# 원격 접근 토큰. *비우면 이 PC(localhost)에서만 접근 가능* — 원격 관리하려면 반드시 설정
AgentToken=

# 셸 워치독: 셸이 꺼져 있으면 30초 간격으로 자동 재시작 (운영 시 true 권장)
AgentWatchdog=false

# --- 자동 업데이트 (스토어 미사용, 사이드카가 처리) ---

# 업데이트 매니페스트 URL (deploy/manifest.example.json 형식). 비우면 비활성.
UpdateUrl=

# 확인 주기(시간). 0이면 자동 확인 안 함 (수동 POST /update 로만)
UpdateCheckHours=6
