name: release-android

# v* 태그를 push 하면 릴리스 APK 를 빌드해 GitHub 릴리스로 발행한다.
#   예)  git tag v0.2.0 && git push origin v0.2.0
# 기기의 Updater 는 .../releases/latest 를 확인해 자동으로 이 릴리스를 받는다.
#
# 네이티브 빌드(gradlew + Android SDK). 서명은 저장소에 커밋된 keystore/kiosk.keystore
# (build.gradle.kts 의 "shared" signingConfig)로 처리하므로 서명용 시크릿이 필요 없다.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # 릴리스 생성/에셋 업로드

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: 버전 계산
        id: ver
        run: |
          # 태그 v0.2.0 -> versionName 0.2.0,  versionCode 는 단조 증가하는 실행번호
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 서명 keystore 복원 (Secret → 파일)
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/ci-release.keystore

      - name: release APK 빌드
        working-directory: android
        env:
          # (선택) 비공개 저장소일 때 기기가 릴리스를 받기 위한 읽기 전용 PAT. 공개 저장소면 비워도 됨.
          UPDATE_TOKEN: ${{ secrets.KIOSK_UPDATE_TOKEN }}
          # (선택) 운영 웹 URL. 저장소 Variables 에 KIOSK_URL 설정. 비우면 build.gradle 기본값(assets).
          KIOSK_URL: ${{ vars.KIOSK_URL }}
          # 릴리스 서명 (GitHub Secret)
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ARGS=(assembleRelease --no-daemon
            "-PappVersionCode=${{ steps.ver.outputs.code }}"
            "-PappVersionName=${{ steps.ver.outputs.name }}"
            "-PupdateUrl=https://api.github.com/repos/${{ github.repository }}/releases/latest"
            "-PRELEASE_STORE_FILE=${PWD}/keystore/ci-release.keystore"
            "-PRELEASE_STORE_PASSWORD=${STORE_PASSWORD}"
            "-PRELEASE_KEY_ALIAS=${KEY_ALIAS}"
            "-PRELEASE_KEY_PASSWORD=${KEY_PASSWORD}")
          if [ -n "${UPDATE_TOKEN:-}" ]; then ARGS+=("-PupdateToken=${UPDATE_TOKEN}"); fi
          if [ -n "${KIOSK_URL:-}" ]; then ARGS+=("-PkioskUrl=${KIOSK_URL}"); fi
          chmod +x gradlew
          ./gradlew "${ARGS[@]}"

      - name: 산출물 + manifest 준비
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/kiosk-release.apk
          SHA=$(sha256sum dist/kiosk-release.apk | cut -d' ' -f1)
          cat > dist/manifest.json <<EOF
          {
            "android": {
              "versionCode": ${{ steps.ver.outputs.code }},
              "versionName": "${{ steps.ver.outputs.name }}",
              "apk": "kiosk-release.apk",
              "sha256": "${SHA}",
              "notes": "${GITHUB_REF_NAME}"
            }
          }
          EOF

      - name: GitHub 릴리스 발행
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/kiosk-release.apk \
            dist/manifest.json \
            --title "${GITHUB_REF_NAME}" \
            --notes "versionCode ${{ steps.ver.outputs.code }} · versionName ${{ steps.ver.outputs.name }}"
